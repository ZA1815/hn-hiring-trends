name: Update data and deploy

on:
  schedule:
    - cron: "17 13 * * *" # daily; new threads appear on the first weekday of each month
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild every month (after taxonomy changes)
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: pip install pytest && pytest -q
      - name: Refresh data
        if: github.event_name != 'push'
        run: python -m pipeline.build ${{ inputs.full && '--full' || '' }}
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/summary.json
          git diff --cached --quiet || { git commit -m "data: refresh $(date -u +%F)" && git push; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
